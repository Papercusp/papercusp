id: su.practice
extends: identity-root
version: 0.1.1
description: "The SU's reusable additive working practice, with its portable prompt generated from the canonical practice tiles."
slots:
  - slot: practice
contributions:
  - id: su-practice-text
    purpose: prompt
    source: fixed
    refresh: source-change
    inputKind: prompt-file
    ref: su.practice:practice
  - id: turn-start-orientation
    purpose: prompt
    source: provider
    refresh: turn
    inputKind: prompt-file
    ref: provider:turn-start-orientation
    producerRef: papercusp.turn-start-orientation@1
    verb: render
    availability: optional
  - id: coord-orientation
    purpose: operational
    source: provider
    refresh: on-demand
    inputKind: setting
    ref: coord-orient
    producerRef: papercusp.coord-orientation@1
    verb: compose
    availability: optional
